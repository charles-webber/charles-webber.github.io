server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    location / {
        try_files $uri $uri/ =404;
    }

    # The official Cubism Framework is emitted as browser modules whose
    # import specifiers omit the .js suffix.
    location ^~ /pet/official/demo/ {
        try_files $uri $uri.js =404;
    }

    location ^~ /pet/official/framework/ {
        try_files $uri $uri.js =404;
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok\n';
    }
}
